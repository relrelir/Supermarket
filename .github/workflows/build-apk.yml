name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Build signed APK
        working-directory: android
        run: ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk shopping-list.apk

      - uses: actions/upload-artifact@v4
        with:
          name: shopping-list-apk
          path: shopping-list.apk

      - name: Publish release (default branch only)
        if: github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: גרסה 1.0.${{ github.run_number }}
          body: הורידו את הקובץ shopping-list.apk לטלפון והתקינו.
          files: shopping-list.apk
          make_latest: true
